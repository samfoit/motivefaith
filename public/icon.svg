<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Lamplight's night lamp: the flame-over-cross mark in lamp gold on the
       night ground. Source for icon-lamp-192/512.png and favicon.ico
       (regenerate with scripts/build-icons.mjs). -->
  <defs>
    <!-- The night sky, deepening toward the bottom -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2540"/>
      <stop offset="100%" stop-color="#12151F"/>
    </linearGradient>
    <!-- The lamp's glow behind the flame -->
    <radialGradient id="halo" cx="256" cy="178" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E9B44C" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#E9B44C" stop-opacity="0"/>
    </radialGradient>
    <!-- Flame: paler at the tip, the lamp's gold at the base -->
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6D892"/>
      <stop offset="100%" stop-color="#E9B44C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#ground)"/>
  <circle cx="256" cy="178" r="170" fill="url(#halo)"/>
  <path d="M256 80C256 80 208 140 208 190C208 216 230 240 256 240C282 240 304 216 304 190C304 140 256 80 256 80Z" fill="url(#flame)"/>
  <!-- Cross, one shape so the beams don't double up where they meet -->
  <path d="M200 248H312A24 24 0 0 1 312 296H280V408A24 24 0 0 1 232 408V296H200A24 24 0 0 1 200 248Z" fill="#E9B44C"/>
</svg>
